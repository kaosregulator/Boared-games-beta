name: Hologram voices

# Reads every time capsule aloud in each hologram voice (scripts/voice) and
# commits the recordings to public/voice/ on the same branch. Only cards whose
# words or voice changed are rebuilt.
on:
  push:
    branches-ignore: [main]
    paths:
      - scripts/voice/**
      - src/room/capsuleText.ts
      - src/room/propCards.ts
      - src/room/propFacts.ts
      - src/utils/gameData.ts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hologram-voices-${{ github.ref }}
  cancel-in-progress: false

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The branch tip, not the pushed commit: a run that waited behind
      # another starts from that run's recordings instead of redoing them.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: What each card says
        run: npx tsx scripts/voice/narration.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q piper-tts==1.3.0
      - uses: actions/cache@v4
        with:
          path: .voice-models
          key: piper-voices-v1
      - name: Read the cards aloud
        run: python scripts/voice/build_voices.py
      - name: Commit the voices
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/voice/narration.json public/voice
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Hologram voices"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
