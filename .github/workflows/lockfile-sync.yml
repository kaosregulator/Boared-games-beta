name: Sync package-lock

# When package.json changes on a branch, regenerate package-lock.json and
# commit it, so dependencies can be added from environments without npm access.
on:
  push:
    branches-ignore: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit the lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then echo "Lockfile already in sync"; exit 0; fi
          git commit -m "Sync package-lock.json with package.json"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
