<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3D Pinball for Windows - Space Cadet</title>
<!--
  alula/SpaceCadetPinball (MIT, see LICENSE.txt): a decompilation of the
  Windows pinball game, built for the web with Emscripten. The .data file
  carries Microsoft's original table art and sounds.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; color: #c0c0c0; font: 12px 'MS Sans Serif', Tahoma, sans-serif; }
</style>
</head>
<body>
<div id="status">Loading Space Cadet...</div>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  var statusEl = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function () {},
    printErr: function (t) { console.warn('[pinball]', t); },
    setStatus: function (t) { statusEl.textContent = t || ''; statusEl.style.display = t ? '' : 'none'; },
    monitorRunDependencies: function (left) { Module.setStatus(left ? 'Loading Space Cadet...' : ''); },
  };
  // Sound: SDL makes its own AudioContext here, and the browser keeps that
  // silent until a click lands in this very frame (a tap on iPhone/iPad
  // doesn't count), so the table's sounds never started. The PC hands us its
  // context instead (window.parent.__pcAudio, already allowed to play), and
  // the game plugs into the PC's speaker and volume (window.parent.__pcAudioOut).
  (function () {
    var host;
    try { host = window.parent !== window && window.parent.__pcAudio ? window.parent : null; } catch (e) { host = null; }
    if (!host) return;
    var ctx = host.__pcAudio;
    var out = host.__pcAudioOut && host.__pcAudioOut.context === ctx ? host.__pcAudioOut : ctx.destination;
    var nodes = [];
    function off() {
      nodes.forEach(function (n) { n.onaudioprocess = null; try { n.disconnect(); } catch (e) {} });
      nodes = [];
    }
    // Only what SDL uses. close() just unplugs: the context is the PC's.
    function Shared() {
      return {
        get sampleRate() { return ctx.sampleRate; },
        get state() { return ctx.state; },
        get currentTime() { return ctx.currentTime; },
        destination: out,
        createBuffer: function () { return ctx.createBuffer.apply(ctx, arguments); },
        createScriptProcessor: function () { var n = ctx.createScriptProcessor.apply(ctx, arguments); nodes.push(n); return n; },
        resume: function () { return ctx.resume(); },
        close: function () { off(); return Promise.resolve(); },
      };
    }
    window.AudioContext = window.webkitAudioContext = Shared;
    // closing the Pinball window: stop feeding the PC's speaker from a dead page
    addEventListener('pagehide', off);
  })();
  // keys go to the game as soon as the window is clicked
  addEventListener('pointerdown', function () { Module.canvas.focus(); });
  addEventListener('load', function () { Module.canvas.focus(); });
</script>
<script async src="SpaceCadetPinball.js"></script>
</body>
</html>
